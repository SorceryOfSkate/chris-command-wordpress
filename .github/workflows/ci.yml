name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install development dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Validate PHP syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File -Filter *.php | Where-Object { $_.FullName -notmatch '[\\/]vendor[\\/]' }
          foreach ($file in $files) {
            php -l $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run WordPress Coding Standards
        run: composer phpcs

      - name: Run News unit tests
        run: composer test

      - name: Validate News block JavaScript
        run: node --check blocks/news/index.js

      - name: Scan the public boundary
        shell: pwsh
        run: ./tools/scan-public-boundary.ps1

      - name: Build and verify the production ZIP
        shell: pwsh
        run: |
          ./tools/build-release.ps1
          ./tools/verify-release.ps1

      - name: Prepare exact release package for WordPress
        shell: pwsh
        run: |
          $header = Get-Content -Raw -LiteralPath chris-command.php
          if ($header -notmatch '(?m)^ \* Version:\s+([0-9]+\.[0-9]+\.[0-9]+)\s*$') { throw 'Unable to read plugin version.' }
          $archive = "dist/chris-command-$($Matches[1]).zip"
          New-Item -ItemType Directory -Path tests/smoke/package | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath tests/smoke/package

      - name: Activate package and run WordPress Plugin Check
        run: |
          npm exec wp-env start -- --config=tests/smoke/.wp-env.release.json
          npm exec wp-env run cli -- --config=tests/smoke/.wp-env.release.json wp plugin activate chris-command
          npm exec wp-env run cli -- --config=tests/smoke/.wp-env.release.json wp eval-file wp-content/chris-command-smoke.php
          npm exec wp-env run cli -- --config=tests/smoke/.wp-env.release.json wp plugin install https://downloads.wordpress.org/plugin/plugin-check.2.1.0.zip --activate
          npm exec wp-env run cli -- --config=tests/smoke/.wp-env.release.json wp plugin check chris-command

      - name: Stop WordPress environment
        if: always()
        continue-on-error: true
        run: npm exec wp-env stop -- --config=tests/smoke/.wp-env.release.json
